version: 2.1

functions:
  setup-python: github.com/circleci-functions/setup-python@v0.5.0

jobs:
  test:
    docker:
      - image: cimg/base:stable
      # The tests import app.py, which connects to Postgres at
      # localhost:5432/formdb as user "postgres" when it loads.
      # Trust auth lets that connection in without putting a password here.
      - image: postgres:16
        environment:
          POSTGRES_DB: formdb
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - checkout
      - setup-python:
          with:
            python-version: "3.13"
      - setup-python/install-packages:
          with:
            # pytest is not in requirements.txt, so install it alongside
            args: pytest
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0
              sleep 1
            done
            echo "Postgres did not start in time" && exit 1
      - run:
          name: Run tests
          command: circleci testsuite run "pytest"
      - store_test_results:
          path: test-reports

workflows:
  ci:
    jobs:
      - test
